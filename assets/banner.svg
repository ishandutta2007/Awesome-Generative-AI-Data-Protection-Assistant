<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#0d1527"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".2"/></linearGradient><filter id="glow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="60"/></filter><filter id="subtleGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="15"/></filter><pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".6" stroke-width=".7" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity=".3"/></pattern></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.45}50%{transform:scale(1.18) translate(20px,-15px);opacity:.7}}@keyframes pulseShield{0%{transform:scale(1);filter:drop-shadow(0 0 8px rgba(56,189,248,.4))}50%{transform:scale(1.03);filter:drop-shadow(0 0 20px rgba(129,140,248,.8))}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes waveBeam{0%{stroke-dashoffset:400}}.orb-1{animation:pulseOrb 8s ease-in-out infinite;transform-origin:200px 100px}.orb-2{animation:pulseOrb 10s ease-in-out infinite reverse;transform-origin:1000px 300px}.shield-icon{animation:pulseShield 4s ease-in-out infinite;transform-origin:600px 95px}.pill-1{animation:floatPill 5s ease-in-out infinite}.pill-2{animation:floatPill 6s ease-in-out infinite 1s}.pill-3{animation:floatPill 5.5s ease-in-out infinite 2s}.pill-4{animation:floatPill 6.5s ease-in-out infinite 1.5s}.circuit-line{stroke-dasharray:20 10;animation:waveBeam 12s linear infinite}</style><rect width="1200" height="420" fill="url(#bgGrad)"/><rect width="1200" height="420" fill="url(#cyberGrid)"/><circle cx="220" cy="120" r="160" fill="#38bdf8" class="orb-1" filter="url(#glow)"/><circle cx="980" cy="280" r="180" fill="#a855f7" class="orb-2" filter="url(#glow)"/><circle cx="600" cy="200" r="140" fill="#3b82f6" filter="url(#glow)" opacity=".25"/><path fill="none" stroke="#38bdf8" stroke-opacity=".35" stroke-width="1.5" d="M 0 100 Q 300 180 600 70 T 1200 120" class="circuit-line"/><path fill="none" stroke="#818cf8" stroke-opacity=".3" stroke-width="1.5" d="M 0 320 Q 350 240 650 350 T 1200 280" class="circuit-line"/><g class="shield-icon"><path fill="url(#accentGrad)" stroke="#38bdf8" stroke-width="2.5" d="M 600 45 L 655 70 C 655 115 632 145 600 160 C 568 145 545 115 545 70 Z"/><circle cx="600" cy="98" r="14" fill="#fff" filter="url(#subtleGlow)"/><circle cx="600" cy="98" r="7" fill="#38bdf8"/><path stroke="#fff" stroke-linecap="round" stroke-width="2" d="M 600 80 L 600 91 M 600 105 L 600 116 M 582 98 L 593 98 M 607 98 L 618 98"/></g><g id="foreground-text" text-anchor="middle"><text x="600" y="215" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-.5">Awesome Generative AI Data Protection</text><text x="600" y="260" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" letter-spacing=".5">Agentic AI Assistants, Autonomous Resilience &amp; Intelligent Cyber-Recovery</text><text x="600" y="295" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5">ENTERPRISE SAAS BENCHMARKS • OPEN-SOURCE FRAMEWORKS • HUMAN-IN-THE-LOOP SAFETY</text></g><g class="pill-1" transform="translate(140, 335)"><rect width="210" height="42" fill="#1e293b" fill-opacity=".85" stroke="#38bdf8" stroke-width="1.2" rx="21"/><circle cx="24" cy="21" r="6" fill="#38bdf8"/><text x="114" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🛡️ Autonomous Recovery</text></g><g class="pill-2" transform="translate(375, 335)"><rect width="210" height="42" fill="#1e293b" fill-opacity=".85" stroke="#818cf8" stroke-width="1.2" rx="21"/><circle cx="24" cy="21" r="6" fill="#818cf8"/><text x="114" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔍 Root-Cause Triage</text></g><g class="pill-3" transform="translate(610, 335)"><rect width="210" height="42" fill="#1e293b" fill-opacity=".85" stroke="#c084fc" stroke-width="1.2" rx="21"/><circle cx="24" cy="21" r="6" fill="#c084fc"/><text x="114" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🤝 Human-in-the-Loop</text></g><g class="pill-4" transform="translate(845, 335)"><rect width="215" height="42" fill="#1e293b" fill-opacity=".85" stroke="#34d399" stroke-width="1.2" rx="21"/><circle cx="24" cy="21" r="6" fill="#34d399"/><text x="117" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔒 PII Guardrails &amp; Audit</text></g></svg>